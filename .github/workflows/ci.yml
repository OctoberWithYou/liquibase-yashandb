name: CI

on:
  push:
    branches: [ "main" ]
    tags-ignore: [ '**' ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - run: mvn -B -ntp clean package

      - uses: actions/upload-artifact@v4
        with:
          name: liquibase-yashandb-${{ github.sha }}
          path: target/liquibase-yashandb-*.jar
          if-no-files-found: error
