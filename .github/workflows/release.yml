name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - run: mvn -B versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false

      - run: mvn -B -ntp clean package -DskipTests

      - uses: softprops/action-gh-release@v2
        with:
          name: liquibase-yashandb ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            target/liquibase-yashandb-${{ steps.version.outputs.version }}.jar
            target/liquibase-yashandb-${{ steps.version.outputs.version }}-sources.jar
